name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Syntax check (every Lua file must parse)
        run: |
          set -e
          count=0
          while IFS= read -r f; do
            luac5.4 -p "$f"
            count=$((count+1))
          done < <(find . -name '*.lua' -not -path './.git/*')
          for f in startup kbd.lua install.lua ship.lua mkconfig.lua; do
            luac5.4 -p "$f"
            count=$((count+1))
          done
          echo "parsed $count files"

      - name: Unit + regression tests
        run: lua5.4 tests/run_all.lua
